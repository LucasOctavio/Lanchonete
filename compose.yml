services:
  backend:
    build:
      context: .
      dockerfile: backend/dockerfile
    container_name: lanchonete_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://lanchonete:lanchonete@db:3306/lanchonete
      CORS_ORIGINS: "*"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@lanchonete.com}
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the project .env file}"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: lanchonete_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: lanchonete_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lanchonete
      MYSQL_USER: lanchonete
      MYSQL_PASSWORD: lanchonete
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - lanchonete_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  lanchonete_data:
